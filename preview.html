<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview — arfuu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ambient background layers (every page) -->
  <div class="bg-fx"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
  <div class="grain"></div>

  <div class="wrap">
    <!-- top nav -->
    <nav class="nav">
      <a class="logo" href="index.html"><span class="mark">🎭</span><em>arfuu</em></a>
    </nav>

    <!-- everything below renders from the draft -->
    <div class="center mt-3 rise">
      <span class="chip blue">👀 Preview — what your friends will see</span>

      <div class="card mt-3">
        <span class="chip pink" id="creatorChip">💜 quiz</span>
        <h2 class="mt-2" id="quizTitle"></h2>

        <!-- first question, exactly as a player sees it -->
        <div id="firstQ" class="mt-3"></div>

        <p class="muted mt-2" id="moreLine"></p>
      </div>

      <div class="row mt-3" style="justify-content:center">
        <a class="btn btn-ghost" href="builder.html">← Back to builder</a>
      </div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script>
    // ============================================================
    // preview.html — a sneak peek of the quiz before publishing.
    // Reads the draft from sessionStorage; no draft = back to start.
    // ============================================================

    const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];

    let draft = null;
    try {
      draft = JSON.parse(sessionStorage.getItem('arfuu_draft'));
    } catch (e) { draft = null; }
    if (!draft || !draft.creatorName) {
      location.href = 'create.html';
    }

    // Paint the preview card from the draft.
    (function render() {
      $('#creatorChip').textContent = `💜 ${draft.creatorName}'s quiz`;
      $('#quizTitle').textContent = draft.title || 'My quiz';

      const n = (draft.questions || []).length;
      const box = $('#firstQ');

      if (!n) {
        box.innerHTML = '<div class="empty"><span class="big">🫗</span><b>No questions yet</b><p>Head back and add some!</p></div>';
        $('#moreLine').textContent = '';
        return;
      }

      const q = draft.questions[0];
      box.innerHTML = `
        <p class="step-label">Question 1 of ${n}</p>
        <b style="display:block;margin-top:0.4rem">${esc(q.text)}</b>
        <div class="stack mt-2">
          ${q.options.map((opt, i) => `
            <button class="opt" disabled><span class="key">${LETTERS[i]}</span>${esc(opt)}</button>`).join('')}
        </div>`;

      $('#moreLine').textContent = n > 1
        ? `…and ${n - 1} more question${n - 1 === 1 ? '' : 's'} waiting 👀`
        : 'Looking good — add more in the builder! ✨';
    })();
  </script>
</body>
</html>
